name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      # The Linux job must exercise the render guarantees, even for a nonstandard Chrome path.
      # Fail setup instead of silently skipping all render tests when this runner loses Chrome.
      - if: runner.os == 'Linux'
        run: |
          chrome="$(command -v google-chrome)"
          test -x "$chrome"
          echo "TIRESIAS_CHROME=$chrome" >> "$GITHUB_ENV"
      # Timing upper bounds are skipped on CI (shared machines are slow and noisy); see timing() in src/test/helper.ts.
      - run: npm test
        env:
          CI: "true"
