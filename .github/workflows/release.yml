name: release
# Publishes a version tag (v1.2.3) to npm through trusted publishing (OIDC): no npm token exists anywhere.
# The package is only STAGED: the owner approves it on npmjs.com (`npm stage approve`, with 2FA) before
# anyone can install it. npm's trusted-publisher setting for this package allows stage publish only, for
# this file and the `release` environment, which GitHub limits to v* tags.
# Each staged version carries npm provenance (a signed link to this commit and run), and the GitHub
# release gets the software bill of materials (CycloneDX SBOM).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
# One run per tag; a new tag never cancels another tag's pending release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # attach the SBOM to the GitHub release
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm 11.15.0 or newer (pinned to a tested 11.x); Node 22 ships npm 10.
      - run: npm install -g npm@11.21.2
      - name: The tag must match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$TAG" ]; then echo "Tag $TAG does not match package.json $v"; exit 1; fi
          # Stable versions only: a prerelease (v1.2.0-rc.1) would need its own dist-tag.
          case "$TAG" in *-*) echo "Prerelease tags are not published by this workflow: $TAG"; exit 1;; esac
      - run: npm ci
      - run: npm test
        env:
          CI: "true"
      - name: Software bill of materials
        run: npm sbom --sbom-format cyclonedx --omit dev > tiresias-sbom.cdx.json
      # Attached BEFORE staging: a staged version can't be staged again, so a rerun after a failed upload
      # would stop at staging. This order makes every step safe to rerun.
      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md. The npm package is staged until the owner approves it."
          gh release upload "$TAG" tiresias-sbom.cdx.json --clobber
      - name: Stage on npm (the owner approves on npmjs.com)
        run: npm stage publish --access public --provenance
